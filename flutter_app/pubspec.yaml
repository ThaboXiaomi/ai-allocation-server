name: ai_allocation_app
description: AI-powered room allocation Flutter app with real-time updates
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Firebase & Auth
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.9
  
  # Real-time Communication
  socket_io_client: ^2.0.3+1
  
  # Local Storage & Security
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  
  # UI Components
  table_calendar: ^3.0.9
  fl_chart: ^0.65.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  image_cropper: ^5.0.1
  
  # Utilities
  intl: ^0.18.1
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  logger: ^2.0.2+1
  uuid: ^4.3.3
  json_annotation: ^4.8.1
  
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  isar_generator: ^3.1.0+1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
